name: CI
on:
  # The default branch is claude/upbeat-volta-pe84n7; main is kept for when the project moves to it.
  push: { branches: [main, "claude/**"] }
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: reporting_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: reporting_test, MYSQL_USER: reporting, MYSQL_PASSWORD: reporting }
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # Real glyph metrics decide pagination, so CI must have the same fonts as the Docker image; poppler is used by PDF tests.
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/**" build
      - name: Every schema field has an engine consumer
        run: pnpm check:schema-consumers
      - name: Example reports match scripts/build-examples.mjs
        run: node scripts/build-examples.mjs && git diff --exit-code -- examples
      - run: pnpm --filter @reporting/server build
      - name: Typecheck designer
        run: pnpm --filter @reporting/designer exec tsc --noEmit
      - name: Unit + integration tests
        run: pnpm -r test
      - name: Quick benchmark (regression smoke)
        run: pnpm --filter @reporting/server bench:quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: |
            test-output/
            benchmarks/results.json
          if-no-files-found: ignore

  designer-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/**" build
      - run: pnpm --filter @reporting/server build
      - run: pnpm --filter @reporting/designer exec playwright install --with-deps chromium
      - run: pnpm --filter @reporting/designer exec playwright test --grep-invert @visual
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/designer/test-results, if-no-files-found: ignore }

  # Screenshot tests run in the official Playwright image, the same one scripts/update-visual-baselines.sh uses,
  # so baselines match pixel for pixel. Keep the image tag in step with @playwright/test.
  designer-visual:
    runs-on: ubuntu-latest
    container: { image: "mcr.microsoft.com/playwright:v1.63.0-noble" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.22.1, cache: pnpm }
      - run: apt-get update && apt-get install -y fonts-noto-core poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/**" build
      - run: pnpm --filter @reporting/server build
      - run: pnpm --filter @reporting/designer exec playwright test --grep @visual
        env: { CI: "true", HOME: /root }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: visual-diffs, path: apps/designer/test-results, if-no-files-found: ignore }

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., target: api, load: true, tags: open-reports-api:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 4000:4000 open-reports-api:ci
          for _ in $(seq 1 30); do curl -fsS localhost:4000/health && break; sleep 1; done
          curl -fsS localhost:4000/health
          curl -fsS -X POST localhost:4000/api/v1/render -H 'content-type: application/json' \
            -d '{"report":{"schemaVersion":"1.0","id":"s","name":"s","sections":[{"type":"detail","children":[{"type":"text","value":"नमस्ते Hello"}]}]},"format":"pdf"}' -o /tmp/s.pdf
          head -c 5 /tmp/s.pdf | grep -q '%PDF-'
