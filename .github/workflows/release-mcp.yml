name: Release open-reports-mcp
# Publishes packages/mcp-server to npm as `open-reports-mcp`, with provenance.
# Release: bump "version" in packages/mcp-server/package.json, then push a tag `mcp-v<version>` (or run this manually).
# Needs the repository secret NPM_TOKEN: an npm granular access token that can publish open-reports-mcp.
on:
  push: { tags: ["mcp-v*"] }
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/**" build && pnpm --filter @reporting/server build
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./packages/mcp-server/dist/npm/package.json').version")
          test "${GITHUB_REF_NAME}" = "mcp-v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - name: Every tool works through the published file (stdio and remote)
        run: pnpm --filter @reporting/server exec vitest run tests/mcp.test.ts tests/mcp-tools.test.ts tests/ai-tools.test.ts
      - name: Publish
        working-directory: packages/mcp-server/dist/npm
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "open-reports-mcp@${version}" version >/dev/null 2>&1; then echo "open-reports-mcp@${version} is already published"; exit 0; fi
          npm publish --provenance --access public
