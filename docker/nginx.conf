server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 12m;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
  location /health { proxy_pass http://api:4000; }
  location / { try_files $uri /index.html; }
}
