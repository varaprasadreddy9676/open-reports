<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Open Reports launch film</title>
<style>
  @font-face { font-family: "Display"; src: url("../assets/fonts/NotoSansDisplay-Bold.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: "Display"; src: url("../assets/fonts/NotoSansDisplay-Regular.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "Accent"; src: url("../assets/fonts/NotoSerifDisplay-Italic.ttf") format("truetype"); font-style: italic; }
  @font-face { font-family: "Mono"; src: url("../assets/fonts/NotoSansMono-Regular.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "Mono"; src: url("../assets/fonts/NotoSansMono-Bold.ttf") format("truetype"); font-weight: 700; }
  :root { --ink: #1a2b49; --muted: #5d6c82; --accent: #2563eb; --paper: #ffffff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Display", sans-serif; color: var(--ink); }
  .scene { position: absolute; inset: 0; display: none; overflow: hidden; }
  .hud { position: absolute; top: 40px; left: 96px; right: 96px; display: flex; justify-content: space-between; font: 400 22px/1 "Mono", monospace; letter-spacing: 0.02em; opacity: 0.6; }
  .kicker { position: absolute; left: 96px; font: 400 24px/1.3 "Mono", monospace; letter-spacing: 0.01em; }
  .headline { position: absolute; left: 96px; font-weight: 700; line-height: 1.02; letter-spacing: -0.025em; }
  .line { display: block; overflow: hidden; padding-bottom: 0.08em; margin-bottom: -0.08em; white-space: nowrap; }
  .line > .in { display: inline-block; will-change: transform; }
  .accent { font-family: "Accent", serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; display: inline-block; padding-right: 0.06em; }
  .card { position: absolute; border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 2px 6px rgba(16, 42, 67, 0.08), 0 30px 80px rgba(16, 42, 67, 0.22); border: 1px solid rgba(16, 42, 67, 0.08); transform-origin: 50% 50%; }
  .card img.shot { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .cursor { position: absolute; width: 34px; height: 34px; left: 0; top: 0; z-index: 5; }
  .ring { position: absolute; border-radius: 50%; border: 3px solid; z-index: 4; }
  .hl { position: absolute; border: 3px solid; border-radius: 8px; z-index: 3; }
  .chips { position: absolute; left: 96px; display: flex; flex-wrap: wrap; gap: 14px; }
  .chip { font: 700 26px/1 "Mono", monospace; padding: 14px 20px; border-radius: 999px; border: 2px solid; background: #fff; white-space: nowrap; }
  .page { position: absolute; background: #fff; border-radius: 6px; box-shadow: 0 2px 6px rgba(16, 42, 67, 0.08), 0 24px 60px rgba(16, 42, 67, 0.22); overflow: hidden; }
  .page img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .terminal { position: absolute; background: #0f172a; color: #e2e8f0; border-radius: 18px; padding: 40px 44px; font: 400 26px/1.65 "Mono", monospace; box-shadow: 0 30px 80px rgba(16, 42, 67, 0.3); }
  .terminal .dots { display: flex; gap: 10px; margin-bottom: 26px; }
  .terminal .dots i { width: 14px; height: 14px; border-radius: 50%; display: block; }
  .terminal .ok { color: #86efac; }
  .terminal .dim { color: #94a3b8; }
  .caret { display: inline-block; width: 14px; height: 30px; background: #e2e8f0; vertical-align: -5px; margin-left: 2px; }
  .note { position: absolute; left: 96px; font: 400 26px/1.4 "Mono", monospace; }
  .tile { position: absolute; border-radius: 16px; overflow: hidden; border: 1px solid rgba(16, 42, 67, 0.08); box-shadow: 0 16px 40px rgba(16, 42, 67, 0.12); }
  .tile img { position: absolute; border-radius: 8px; box-shadow: 0 6px 18px rgba(16, 42, 67, 0.16); }
  .tile .label { position: absolute; left: 22px; bottom: 18px; font: 700 26px/1 "Display", sans-serif; }
  .check { position: absolute; right: 18px; top: 18px; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; }
  .mark { display: inline-block; border-radius: 22%; position: relative; vertical-align: middle; }
  .cta { display: inline-flex; align-items: center; gap: 14px; background: #2563eb; color: #fff; border-radius: 999px; padding: 22px 40px; font: 700 32px/1 "Display", sans-serif; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="./main.mjs"></script>
</body>
</html>
