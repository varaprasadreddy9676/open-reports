<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Open Reports launch film</title>
<style>
  @font-face { font-family: "Display"; src: url("../assets/fonts/NotoSansDisplay-Bold.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: "Display"; src: url("../assets/fonts/NotoSansDisplay-Regular.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "Accent"; src: url("../assets/fonts/NotoSerifDisplay-Italic.ttf") format("truetype"); font-style: italic; }
  @font-face { font-family: "Mono"; src: url("../assets/fonts/NotoSansMono-Regular.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "Mono"; src: url("../assets/fonts/NotoSansMono-Bold.ttf") format("truetype"); font-weight: 700; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Display", sans-serif; }
  .scene { position: absolute; inset: 0; display: none; overflow: hidden; }
  .abs { position: absolute; }
  .display { font-family: "Display", sans-serif; font-weight: 700; letter-spacing: -0.03em; line-height: 0.98; white-space: nowrap; }
  .accent { font-family: "Accent", serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; padding-right: 0.05em; }
  .mono { font-family: "Mono", monospace; }
  .mask { overflow: hidden; display: block; padding-bottom: 0.1em; margin-bottom: -0.1em; }
  .mask > span { display: inline-block; }
  .browser { position: absolute; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 2px 8px rgba(11, 18, 32, 0.08), 0 40px 100px rgba(11, 18, 32, 0.28); }
  .chrome { height: 40px; background: #f3f5f9; border-bottom: 1px solid #e3e8f0; display: flex; align-items: center; gap: 9px; padding: 0 16px; }
  .chrome i { width: 13px; height: 13px; border-radius: 50%; display: block; }
  .chrome .url { margin-left: 18px; flex: 1; max-width: 520px; height: 24px; border-radius: 8px; background: #fff; border: 1px solid #e3e8f0; font: 400 14px/24px "Mono"; color: #5d6c82; padding: 0 12px; }
  .viewport { position: relative; overflow: hidden; }
  .viewport img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .page { position: absolute; background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35); }
  .page img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .card { position: absolute; border-radius: 18px; background: #131c2e; border: 1px solid #26344d; color: #fff; font: 700 46px/1.15 "Display"; padding: 36px 40px; }
  .strike { position: absolute; left: 30px; top: 50%; height: 6px; background: #ef4444; border-radius: 3px; transform-origin: 0 50%; }
  .pill { display: inline-block; border-radius: 999px; padding: 16px 28px; font: 700 30px/1 "Mono"; }
  .term { position: absolute; border-radius: 18px; background: #050a14; border: 1px solid #26344d; color: #e2e8f0; font: 400 30px/1.6 "Mono"; padding: 34px 40px; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.45); }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="./main.mjs"></script>
</body>
</html>
